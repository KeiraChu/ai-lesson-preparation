server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AI_DB_URL:jdbc:mysql://localhost:3306/ai_lesson_preparation}
    username: ${AI_DB_USERNAME:root}
    password: ${AI_DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
  # 配置缓存
  redis:
    host: ${AI_REDIS_HOST:localhost}
    port: ${AI_REDIS_PORT:6379}
    database: 3 #Redis数据库索引（默认为0）
    lettuce:
      pool:
        max-active: 8 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 8 # 连接池中的最大空闲连接
        min-idle: 1  # 连接池中的最小空闲连接
    timeout: PT10S # 连接超时时间
    password: ${AI_REDIS_PASSWORD:}

ai:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${AI_JWT_SECRET:change-me-in-production}
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: token
  text:
    apiKey: ${DASHSCOPE_API_KEY:}
    appId: ${AI_TEXT_APP_ID:}
  ppt:
    APPID: ${AI_PPT_APP_ID:}
    APISecret: ${AI_PPT_API_SECRET:}
  practice:
    apiKey: ${DASHSCOPE_API_KEY:}
    appId: ${AI_PRACTICE_APP_ID:}
  analyze:
    apiKey: ${DASHSCOPE_API_KEY:}
    appId: ${AI_ANALYZE_APP_ID:}
  file:
    upload-path: /uploads/
    ip-port: ${AI_FILE_BASE_URL:localhost:8080}
  orchestration:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:development-only}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:90}

